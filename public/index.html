<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Messenger</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e5;
    --accent: #1a1a1a;
    --danger: #c0392b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ececec;
    color: var(--text);
    height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 6px;
  }
  /* App shell: full width on phones (with a small breathing margin),
     phone-sized frame on wide screens */
  #app {
    width: 100%;
    max-width: 480px;
    background: var(--bg);
    height: calc(100dvh - 12px);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
  }
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }
  .center { justify-content: center; align-items: center; }

  input, select {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px; /* >=16px prevents iOS auto-zoom on focus */
    width: 100%;
    background: #fff;
    color: var(--text);
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    min-height: 44px;
  }
  button.secondary { background: #f2f2f2; color: var(--text); }
  button.danger { background: var(--danger); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(12px + var(--safe-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar .nickname { font-weight: 600; font-size: 15px; }
  .sos-btn { background: var(--danger); padding: 8px 14px; border-radius: 20px; font-size: 13px; min-height: 36px; }

  .sos-banner {
    background: #fff4f2;
    border-bottom: 1px solid #f3c9c1;
    padding: 10px 16px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .sos-banner .alert-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .sos-banner a { color: var(--danger); font-weight: 600; text-decoration: none; }

  .search-bar { padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

  .chat-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .chat-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
  }
  .chat-item:active { background: #fafafa; }
  .chat-item .name { font-weight: 600; }
  .chat-item .preview { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-nav button { flex: 1; border-radius: 0; background: #fff; color: var(--text); padding: 12px 2px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom-nav button.lock { color: var(--danger); }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(12px + var(--safe-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chat-header .back { cursor: pointer; font-size: 22px; padding: 4px 8px 4px 0; }

  .messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 14px; word-break: break-word; }
  .msg.mine { align-self: flex-end; background: #1a1a1a; color: #fff; }
  .msg.theirs { align-self: flex-start; background: #f0f0f0; color: #1a1a1a; }
  .msg a { color: inherit; text-decoration: underline; }
  .msg img { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; }

  .composer {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 12px calc(8px + var(--safe-bottom));
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer-actions { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .composer-actions button { flex-shrink: 0; padding: 8px 10px; font-size: 13px; background: #f2f2f2; color: var(--text); min-height: 36px; }
  .composer-row { display: flex; gap: 8px; }
  .composer-row input { flex: 1; }
  .composer-row button { flex-shrink: 0; min-width: 44px; }

  .settings-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: calc(16px + var(--safe-bottom)); }
  .settings-body label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; }

  .error-text { color: var(--danger); font-size: 13px; min-height: 18px; }
  .stack { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; }

  /* Map picker modal */
  #map-modal {
    display: none;
    position: absolute;
    inset: 0;
    background: #fff;
    z-index: 50;
    flex-direction: column;
  }
  #map-modal.active { display: flex; }
  #map-container { flex: 1; }
  .map-modal-bar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: calc(10px + var(--safe-top)) 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  .map-modal-footer {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + var(--safe-bottom));
    border-top: 1px solid var(--border);
  }
  .map-modal-footer button { flex: 1; }
</style>
</head>
<body>
<div id="app">

<!-- LOGIN / REGISTER -->
<div id="screen-login" class="screen active center">
  <div class="stack">
    <h1>Вход в сеть</h1>
    <input id="login-nickname" placeholder="Придумайте никнейм" autocomplete="off">
    <button onclick="register()">Войти в сеть</button>
    <div class="error-text" id="login-error"></div>
  </div>
</div>

<!-- LOCK SCREEN -->
<div id="screen-lock" class="screen center">
  <div class="stack">
    <h1>Введите PIN</h1>
    <input id="lock-pin" type="password" inputmode="numeric" placeholder="PIN-код" autocomplete="off">
    <button onclick="submitPin()">Разблокировать</button>
    <div class="error-text" id="lock-error"></div>
  </div>
</div>

<!-- MAIN: CHAT LIST -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <span class="nickname" id="main-nickname"></span>
    <button class="sos-btn" id="sos-toggle-btn" onclick="toggleSos()">SOS</button>
  </div>
  <div class="sos-banner" id="sos-banner" style="display:none;"></div>
  <div class="search-bar">
    <input id="search-input" placeholder="Поиск по никнейму" oninput="onSearch()">
  </div>
  <div class="chat-list" id="chat-list"></div>
  <div class="bottom-nav">
    <button onclick="showScreen('screen-main')">Чаты</button>
    <button onclick="openContacts()">Контакты</button>
    <button onclick="openSettings()">Настройки</button>
    <button class="lock" onclick="lockNow()">Заблокировать</button>
  </div>
</div>

<!-- CONTACTS -->
<div id="screen-contacts" class="screen">
  <div class="chat-header">
    <span class="back" onclick="showScreen('screen-main')">←</span>
    <span>Контакты</span>
  </div>
  <div class="chat-list" id="contacts-list"></div>
</div>

<!-- CHAT -->
<div id="screen-chat" class="screen">
  <div class="chat-header">
    <span class="back" onclick="showScreen('screen-main')">←</span>
    <span id="chat-with"></span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <div class="composer-actions">
      <button onclick="pickFile('file')">📎 Файл</button>
      <button onclick="pickFile('image')">🖼️ Фото</button>
      <button onclick="sendMyLocation()">📍 Моё место</button>
      <button onclick="openMapPicker()">🗺️ Точка на карте</button>
    </div>
    <div class="composer-row">
      <input id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>
  <input type="file" id="file-input" style="display:none" accept="*/*">
</div>

<!-- SETTINGS -->
<div id="screen-settings" class="screen">
  <div class="chat-header">
    <span class="back" onclick="showScreen('screen-main')">←</span>
    <span>Настройки безопасности</span>
  </div>
  <div class="settings-body">
    <div class="field">
      <label>Основной PIN</label>
      <input id="set-normal-pin" type="password" inputmode="numeric">
    </div>
    <div class="field">
      <label>Защитный PIN (аварийное стирание)</label>
      <input id="set-duress-pin" type="password" inputmode="numeric">
    </div>
    <div class="field">
      <label>Автоблокировка</label>
      <select id="set-autolock">
        <option value="0">Нет</option>
        <option value="5">5 секунд</option>
        <option value="10">10 секунд</option>
        <option value="15">15 секунд</option>
        <option value="30" selected>30 секунд</option>
        <option value="60">60 секунд</option>
      </select>
    </div>
    <div class="field">
      <label>SOS-контакты (никнеймы через запятую, должны быть зарегистрированы)</label>
      <input id="set-sos-contacts" placeholder="друг1, друг2">
    </div>
    <div class="field">
      <label>Контакты уведомления об очистке (никнеймы через запятую)</label>
      <input id="set-wipe-contacts" placeholder="друг1, друг2">
    </div>
    <div class="field">
      <label>Push-уведомления</label>
      <button id="push-toggle-btn" class="secondary" onclick="togglePush()">Включить уведомления</button>
      <div style="font-size:12px;color:var(--muted);">На iPhone работает только если сайт добавлен на «Экран Домой» (Safari → Поделиться → На экран Домой).</div>
    </div>
    <button onclick="saveSettings()">Сохранить</button>
    <div class="error-text" id="settings-status"></div>
  </div>
</div>

<!-- MAP PICKER MODAL -->
<div id="map-modal">
  <div class="map-modal-bar">
    <strong>Выберите точку на карте</strong>
    <span onclick="closeMapPicker()" style="cursor:pointer;font-size:20px;">✕</span>
  </div>
  <div id="map-container"></div>
  <div class="map-modal-footer">
    <button class="secondary" onclick="closeMapPicker()">Отмена</button>
    <button onclick="confirmMapPick()">Отправить точку</button>
  </div>
</div>

</div>

<script>
let state = {
  nickname: localStorage.getItem('nickname') || null,
  currentChat: null,
  ws: null,
  autoLockSeconds: 30,
  lockTimer: null,
  sosActive: false,
  sosWatchId: null,
  incomingSos: {}, // from -> {lat,lng,ts}
  leafletMap: null,
  pickedLatLng: null,
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  resetAutoLockTimer();
}

// ---------- Registration / login ----------

async function register() {
  const nickname = document.getElementById('login-nickname').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!nickname) { errEl.textContent = 'Введите никнейм.'; return; }

  const res = await fetch('/api/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nickname })
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error; return; }

  localStorage.setItem('nickname', nickname);
  state.nickname = nickname;
  enterApp();
}

function enterApp() {
  document.getElementById('main-nickname').textContent = state.nickname;
  connectWs();
  loadConversations();
  loadSettingsIntoForm();
  pollIncomingSos();
  registerServiceWorker();
  showScreen('screen-main');
}

window.addEventListener('load', async () => {
  if (state.nickname) {
    const stillExists = await checkAccountExists(state.nickname);
    if (stillExists) {
      enterApp();
    } else {
      localStorage.removeItem('nickname');
      state.nickname = null;
      document.getElementById('login-error').textContent =
        'Хранилище было сброшено на сервере (демо-режим) — зарегистрируйся заново.';
    }
  }
  ['click','keydown','touchstart'].forEach(evt =>
    document.addEventListener(evt, resetAutoLockTimer)
  );
});

async function checkAccountExists(nickname) {
  try {
    const res = await fetch(`/api/settings/${encodeURIComponent(nickname)}`);
    return res.ok;
  } catch (e) {
    return false;
  }
}

// ---------- WebSocket ----------

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  state.ws = new WebSocket(`${proto}://${location.host}/ws?nickname=${encodeURIComponent(state.nickname)}`);
  state.ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'chat') {
      if (state.currentChat === msg.from) renderMessage(msg, false);
      loadConversations();
    }
    if (msg.type === 'chat_ack') {
      loadConversations();
    }
    if (msg.type === 'sos_alert') {
      alert(`⚠️ ${msg.from}: ${msg.text}`);
    }
    if (msg.type === 'sos_location') {
      state.incomingSos[msg.from] = { lat: msg.lat, lng: msg.lng, ts: msg.ts };
      renderSosBanner();
    }
    if (msg.type === 'sos_stopped') {
      delete state.incomingSos[msg.from];
      renderSosBanner();
    }
    if (msg.type === 'wipe_notice') {
      alert(msg.text);
    }
    if (msg.type === 'error') {
      alert(msg.error);
    }
  };
  state.ws.onclose = () => setTimeout(connectWs, 2000);
}

// Fallback: poll for SOS alerts that were stored while we were offline
// (websocket push only reaches contacts who are connected right now).
function pollIncomingSos() {
  setInterval(async () => {
    if (!state.nickname) return;
    try {
      const res = await fetch(`/api/sos/incoming/${encodeURIComponent(state.nickname)}`);
      const data = await res.json();
      let changed = false;
      for (const a of data.alerts) {
        if (!state.incomingSos[a.from] || state.incomingSos[a.from].ts !== a.ts) changed = true;
        state.incomingSos[a.from] = { lat: a.lat, lng: a.lng, ts: a.ts };
      }
      if (changed) renderSosBanner();
    } catch (e) {}
  }, 8000);
}

function renderSosBanner() {
  const banner = document.getElementById('sos-banner');
  const entries = Object.entries(state.incomingSos);
  if (!entries.length) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  banner.innerHTML = entries.map(([from, loc]) => {
    const ago = Math.max(0, Math.round((Date.now() - loc.ts) / 1000));
    const mapUrl = `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
    return `<div class="alert-row">
      <span>⚠️ <b>${escapeHtml(from)}</b> — сигнал SOS (${ago} сек назад)</span>
      <a href="${mapUrl}" target="_blank">Карта</a>
    </div>`;
  }).join('');
}

// ---------- Search & chat list ----------

let searchTimeout;
function onSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    const q = document.getElementById('search-input').value.trim();
    if (!q) { loadConversations(); return; }
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    renderList(data.results.filter(n => n !== state.nickname).map(n => ({ nickname: n, lastMessage: null })));
  }, 250);
}

async function loadConversations() {
  const res = await fetch(`/api/conversations/${encodeURIComponent(state.nickname)}`);
  const data = await res.json();
  renderList(data.conversations);
}

function renderList(items) {
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(item.nickname);
    const preview = item.lastMessage
      ? (item.lastMessage.kind === 'text' ? item.lastMessage.text : '[' + labelForKind(item.lastMessage.kind) + ']')
      : '';
    div.innerHTML = `
      <div>
        <div class="name">${escapeHtml(item.nickname)}</div>
        <div class="preview">${escapeHtml(preview || '')}</div>
      </div>`;
    list.appendChild(div);
  });
}

function labelForKind(kind) {
  if (kind === 'location') return 'локация';
  if (kind === 'file') return 'файл';
  return '';
}

// ---------- Contacts ----------

async function openContacts() {
  showScreen('screen-contacts');
  const res = await fetch(`/api/contacts/${encodeURIComponent(state.nickname)}`);
  const data = await res.json();
  const list = document.getElementById('contacts-list');
  list.innerHTML = '';
  if (!data.contacts || !data.contacts.length) {
    list.innerHTML = '<div class="chat-item" style="color:var(--muted);cursor:default;">Пока нет контактов — найди кого-нибудь через поиск в «Чатах».</div>';
    return;
  }
  data.contacts.forEach(nickname => {
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(nickname);
    div.innerHTML = `<div><div class="name">${escapeHtml(nickname)}</div></div>`;
    list.appendChild(div);
  });
}

// ---------- Chat screen ----------

async function openChat(nickname) {
  state.currentChat = nickname;
  document.getElementById('chat-with').textContent = nickname;
  const res = await fetch(`/api/messages/${encodeURIComponent(state.nickname)}/${encodeURIComponent(nickname)}`);
  const data = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';
  data.messages.forEach(m => renderMessage(m, m.from === state.nickname));
  showScreen('screen-chat');
}

function renderMessage(m, mine) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${mine ? 'mine' : 'theirs'}`;

  if (m.kind === 'location') {
    const mapUrl = `https://www.google.com/maps?q=${m.lat},${m.lng}`;
    div.innerHTML = `📍 ${escapeHtml(m.label || 'Локация')}<br><a href="${mapUrl}" target="_blank">Открыть на карте</a>`;
  } else if (m.kind === 'file') {
    const isImage = (m.mime || '').startsWith('image/');
    if (isImage) {
      div.innerHTML = `<img src="${m.fileUrl}" alt="${escapeHtml(m.fileName || '')}"><a href="${m.fileUrl}" target="_blank">${escapeHtml(m.fileName || 'файл')}</a>`;
    } else {
      div.innerHTML = `📎 <a href="${m.fileUrl}" target="_blank">${escapeHtml(m.fileName || 'файл')}</a>`;
    }
  } else {
    div.textContent = m.text;
  }

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text || !state.currentChat) return;
  const payload = { type: 'chat', to: state.currentChat, kind: 'text', text };
  state.ws.send(JSON.stringify(payload));
  renderMessage({ kind: 'text', text }, true);
  input.value = '';
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- File / photo sending ----------

function pickFile(kind) {
  const input = document.getElementById('file-input');
  input.accept = kind === 'image' ? 'image/*' : '*/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file || !state.currentChat) return;
    const form = new FormData();
    form.append('file', file);
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) { alert('Не удалось загрузить файл.'); return; }
    const payload = {
      type: 'chat', to: state.currentChat, kind: 'file',
      fileUrl: data.url, fileName: data.fileName, mime: data.mime
    };
    state.ws.send(JSON.stringify(payload));
    renderMessage(payload, true);
    input.value = '';
  };
  input.click();
}

// ---------- Location sending ----------

function getBestLocation(onDone) {
  if (!navigator.geolocation) { onDone(null); return; }
  let best = null, attempts = 0;
  const tryOnce = () => {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
        attempts++;
        if (attempts < 3) setTimeout(tryOnce, 700); else onDone(best);
      },
      () => { attempts++; if (attempts < 3) setTimeout(tryOnce, 700); else onDone(best); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  };
  tryOnce();
}

function sendMyLocation() {
  if (!state.currentChat) return;
  const btn = event.target;
  btn.textContent = '📍 Определяю...';
  getBestLocation((pos) => {
    btn.textContent = '📍 Моё место';
    if (!pos) { alert('Не удалось получить местоположение. Разрешите доступ к геолокации.'); return; }
    const payload = {
      type: 'chat', to: state.currentChat, kind: 'location',
      lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'Текущее местоположение'
    };
    state.ws.send(JSON.stringify(payload));
    renderMessage(payload, true);
  });
}

function openMapPicker() {
  if (!state.currentChat) return;
  document.getElementById('map-modal').classList.add('active');
  setTimeout(() => {
    if (!state.leafletMap) {
      state.leafletMap = L.map('map-container').setView([41.3, 69.24], 12); // default: Tashkent
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(state.leafletMap);
      state.marker = null;
      state.leafletMap.on('click', (e) => {
        state.pickedLatLng = e.latlng;
        if (state.marker) state.leafletMap.removeLayer(state.marker);
        state.marker = L.marker(e.latlng).addTo(state.leafletMap);
      });
      navigator.geolocation && navigator.geolocation.getCurrentPosition((pos) => {
        state.leafletMap.setView([pos.coords.latitude, pos.coords.longitude], 14);
      }, () => {});
    }
    state.leafletMap.invalidateSize();
  }, 50);
}

function closeMapPicker() {
  document.getElementById('map-modal').classList.remove('active');
}

function confirmMapPick() {
  if (!state.pickedLatLng) { alert('Нажмите на карту, чтобы выбрать точку.'); return; }
  const payload = {
    type: 'chat', to: state.currentChat, kind: 'location',
    lat: state.pickedLatLng.lat, lng: state.pickedLatLng.lng, label: 'Отправленная точка'
  };
  state.ws.send(JSON.stringify(payload));
  renderMessage(payload, true);
  closeMapPicker();
}

// ---------- Push notifications ----------

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('/sw.js');
    updatePushButtonLabel();
  } catch (e) { console.warn('SW registration failed', e); }
}

async function updatePushButtonLabel() {
  const btn = document.getElementById('push-toggle-btn');
  if (!btn || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    if (btn) { btn.textContent = 'Push не поддерживается в этом браузере'; btn.disabled = true; }
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  btn.textContent = sub ? 'Отключить уведомления' : 'Включить уведомления';
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function togglePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Этот браузер не поддерживает push-уведомления.');
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const existing = await reg.pushManager.getSubscription();

  if (existing) {
    await fetch('/api/push/unsubscribe', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nickname: state.nickname, endpoint: existing.endpoint })
    });
    await existing.unsubscribe();
    updatePushButtonLabel();
    return;
  }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    alert('Уведомления заблокированы в настройках браузера.');
    return;
  }

  const keyRes = await fetch('/api/push/vapid-public-key');
  const { publicKey } = await keyRes.json();

  const subscription = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(publicKey)
  });

  await fetch('/api/push/subscribe', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nickname: state.nickname, subscription })
  });

  updatePushButtonLabel();
}

function openSettings() { showScreen('screen-settings'); loadSettingsIntoForm(); updatePushButtonLabel(); }

async function loadSettingsIntoForm() {
  const res = await fetch(`/api/settings/${encodeURIComponent(state.nickname)}`);
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById('set-sos-contacts').value = (data.sosContacts || []).join(', ');
  document.getElementById('set-wipe-contacts').value = (data.wipeNoticeContacts || []).join(', ');
  document.getElementById('set-autolock').value = String(data.autoLockSeconds || 0);
  state.autoLockSeconds = data.autoLockSeconds || 0;
}

async function saveSettings() {
  const normalPin = document.getElementById('set-normal-pin').value.trim();
  const duressPin = document.getElementById('set-duress-pin').value.trim();
  const autoLockSeconds = parseInt(document.getElementById('set-autolock').value, 10);
  const sosContacts = document.getElementById('set-sos-contacts').value.split(',').map(s=>s.trim()).filter(Boolean);
  const wipeNoticeContacts = document.getElementById('set-wipe-contacts').value.split(',').map(s=>s.trim()).filter(Boolean);
  const statusEl = document.getElementById('settings-status');
  statusEl.style.color = 'var(--danger)';

  if (normalPin && duressPin) {
    const res = await fetch('/api/pin/setup', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nickname: state.nickname, normalPin, duressPin })
    });
    const data = await res.json();
    if (!res.ok) { statusEl.textContent = data.error; return; }
  }

  await fetch('/api/settings', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nickname: state.nickname, sosContacts, wipeNoticeContacts, autoLockSeconds: autoLockSeconds || null })
  });

  state.autoLockSeconds = autoLockSeconds || 0;
  statusEl.style.color = '#1a1a1a';
  statusEl.textContent = 'Сохранено.';
  document.getElementById('set-normal-pin').value = '';
  document.getElementById('set-duress-pin').value = '';
  resetAutoLockTimer();
}

// ---------- Lock / PIN ----------

function lockNow() {
  showScreen('screen-lock');
}

function resetAutoLockTimer() {
  clearTimeout(state.lockTimer);
  if (!state.autoLockSeconds) return;
  if (!state.nickname) return;
  if (document.getElementById('screen-lock').classList.contains('active')) return;
  state.lockTimer = setTimeout(lockNow, state.autoLockSeconds * 1000);
}

async function submitPin() {
  const pin = document.getElementById('lock-pin').value;
  const errEl = document.getElementById('lock-error');
  const res = await fetch('/api/pin/check', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nickname: state.nickname, pin })
  });
  const data = await res.json();
  document.getElementById('lock-pin').value = '';

  if (data.result === 'invalid') {
    errEl.textContent = 'Неверный PIN.';
    return;
  }
  if (data.result === 'normal') {
    errEl.textContent = '';
    enterApp();
    return;
  }
  if (data.result === 'duress') {
    await fetch('/api/wipe', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nickname: state.nickname })
    });
    document.getElementById('chat-list').innerHTML = '';
    errEl.textContent = '';
    enterApp(); // SOS (if active) keeps running regardless — see below.
  }
}

// ---------- SOS (independent of chat/wipe state) ----------

function toggleSos() {
  if (state.sosActive) {
    stopSos();
  } else {
    triggerSos();
  }
}

async function triggerSos() {
  if (!confirm('Отправить сигнал SOS доверенным контактам и начать передачу геолокации?')) return;
  const res = await fetch('/api/sos/trigger', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ nickname: state.nickname })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  if (data.warning) alert(data.warning);
  startSosLocationSharing();
  state.sosActive = true;
  document.getElementById('sos-toggle-btn').textContent = 'Остановить SOS';
}

function stopSos() {
  if (state.sosWatchId !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(state.sosWatchId);
    state.sosWatchId = null;
  }
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: 'sos_stop' }));
  }
  state.sosActive = false;
  document.getElementById('sos-toggle-btn').textContent = 'SOS';
}

function startSosLocationSharing() {
  if (state.sosWatchId !== null || !navigator.geolocation) return;
  state.sosWatchId = navigator.geolocation.watchPosition((pos) => {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify({
        type: 'sos_location',
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      }));
    }
  }, () => {}, { enableHighAccuracy: true, maximumAge: 5000 });
}

// Note: stopSos() is the only thing that stops watchPosition/SOS.
// The duress-PIN wipe flow above never calls stopSos() — SOS keeps
// running in the background even after a wipe, by design.
</script>
